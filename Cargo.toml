[package]
name = "geon"
version = "0.1.0"
edition = "2021"
description = "Differentiable, GPU-ready general-relativity engine — autodiff through Einstein's equations, geodesic ray tracing on CPU and GPU."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Arth-Singh/geon"
keywords = ["general-relativity", "physics", "raytracing", "gpu", "spacetime"]
categories = ["science", "simulation"]

[lib]
name = "geon"
path = "src/lib.rs"

[[bin]]
name = "render"
path = "src/bin/render.rs"

[[bin]]
name = "validate_shadow"
path = "src/bin/validate_shadow.rs"

[[bin]]
name = "energy_conditions"
path = "src/bin/energy_conditions.rs"

[[bin]]
name = "burn_smoke"
path = "src/bin/burn_smoke.rs"
required-features = ["cuda"]

[dependencies]
nalgebra = "0.33"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png"] }
indicatif = { version = "0.17", features = ["rayon"] }
clap = { version = "4.5", features = ["derive"] }

# Phase 4: Rust-native autodiff + GPU. Optional so the GR engine still
# compiles fast without burn. Activate on the B200 with --features cuda.
burn = { version = "0.21", default-features = false, features = ["std", "autodiff", "train"], optional = true }
rand = { version = "0.9", optional = true }
rand_distr = { version = "0.5", optional = true }

[features]
default = []
# `cuda` brings in burn with the CUDA backend. Build on the B200 with:
#   cargo build --release --features cuda
cuda = ["dep:burn", "burn/cuda", "burn/fusion", "dep:rand", "dep:rand_distr"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.dev]
opt-level = 1

# `cargo build --profile=fast` — for burn iteration on the B200. Skips LTO
# (5+ min on burn_smoke alone) and keeps codegen parallel. Still optimised
# enough that wall-clock training time isn't dominated by Rust overhead.
[profile.fast]
inherits = "release"
lto = "off"
codegen-units = 16
opt-level = 3
