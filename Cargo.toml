[package]
name = "geon"
version = "0.1.0"
edition = "2021"
description = "Differentiable, GPU-ready general-relativity engine — autodiff through Einstein's equations, geodesic ray tracing on CPU and GPU."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Arth-Singh/geon"
keywords = ["general-relativity", "physics", "raytracing", "gpu", "spacetime"]
categories = ["science", "simulation"]

[lib]
name = "geon"
path = "src/lib.rs"

[[bin]]
name = "render"
path = "src/bin/render.rs"

[[bin]]
name = "validate_shadow"
path = "src/bin/validate_shadow.rs"

[[bin]]
name = "energy_conditions"
path = "src/bin/energy_conditions.rs"

[dependencies]
nalgebra = "0.33"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png"] }
indicatif = { version = "0.17", features = ["rayon"] }
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.dev]
opt-level = 1
